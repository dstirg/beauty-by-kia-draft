name = "beauty-by-kia"
compatibility_date = "2026-08-01"
pages_build_output_dir = "./dist"

[vars]
APP_ENVIRONMENT = "production"
LOCAL_STORAGE_FALLBACK = "false"
PAYMENTS_ENABLED = "false"
SESSION_TTL_SECONDS = "14400"

[[d1_databases]]
binding = "DB"
database_name = "beauty-by-kia-db"
database_id = "06f0e880-056c-475d-adda-e9689dd2c843"

# Configure R2 bindings after the owner creates the resources:
#   PUBLIC_GALLERY   -> private R2 bucket served only through approved routes
#   PRIVATE_UPLOADS  -> private R2 bucket with no public development URL
